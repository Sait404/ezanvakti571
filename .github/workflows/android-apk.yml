# EzanVakti571 — Android APK derleme ve indirme bağlantısı
# Tetikleme: main dalına push, "v*" etiketi veya Actions sekmesinden "Run workflow".
# Çıktı: Actions çalıştırmasının "Artifacts" bölümünde ve (etiketle tetiklenirse) Releases sayfasında APK.
#
# İmzalama: Depo ayarlarında şu sırlar tanımlıysa APK yayın anahtarıyla imzalanır:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Tanımlı değilse test amaçlı debug anahtarıyla imzalanır (telefona kurulur, Play Store'a yüklenemez).
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK, GitHub'ın ubuntu sunucularında hazır kurulu gelir (ANDROID_HOME).
      - name: Android SDK kontrolü
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > /tmp/local.properties

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler
        run: |
          npm run typecheck
          npx expo lint
          npm test

      - name: Yerel Android projesini üret
        run: |
          npx expo prebuild --platform android --no-install
          cp /tmp/local.properties android/local.properties

      - name: İmza anahtarını hazırla (varsa)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<PROPS
          EV571_STORE_FILE=release.keystore
          EV571_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EV571_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          EV571_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          s=s.replace("signingConfigs {", """signingConfigs {
                  release {
                      storeFile file(EV571_STORE_FILE)
                      storePassword EV571_STORE_PASSWORD
                      keyAlias EV571_KEY_ALIAS
                      keyPassword EV571_KEY_PASSWORD
                  }""",1)
          s=re.sub(r"(release \{[^}]*?)signingConfig signingConfigs\.debug", r"\1signingConfig signingConfigs.release", s, count=1, flags=re.S)
          open(p,'w').write(s)
          PY

      - name: APK derle (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı adlandır
        id: name
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/EzanVakti571-${VERSION}.apk"
          ls -la out

      - name: İndirilebilir dosya olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: EzanVakti571-apk
          path: out/*.apk
          retention-days: 30

      # main dalındaki her başarılı derleme APK'yı Releases sayfasına koyar:
      # kalıcı indirme bağlantısı → https://github.com/<kullanıcı>/<depo>/releases/latest
      - name: Releases sayfasına ekle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build{1}', steps.name.outputs.version, github.run_number) }}
          name: EzanVakti571 ${{ steps.name.outputs.version }} (derleme ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            EzanVakti571 Android APK. Kurulum: dosyayı telefona indirip açın; "Bilinmeyen kaynaklardan yükleme" iznini onaylayın.
            Not: Bu sürümde vakitler cihazda hesaplanır ve "Hesaplanan vakit" etiketiyle gösterilir.
